services:
  qoder-api-proxy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: "${CLI2API_IMAGE:-ghcr.io/caigee-cmd/cli2api:latest}"
    container_name: qoder-api-proxy
    environment:
      HOST: "0.0.0.0"
      PORT: "3010"
      QODER_DATA_DIR: "/data"
      QODER_RUNTIME_DIR: "/run/cli2api"
      QODER_SSE_DIAGNOSTIC_MODELS: "${QODER_SSE_DIAGNOSTIC_MODELS:-}"
      WORKBUDDY_EXTRA_MODELS: '[{"id":"deepseek-v4.1-flash","name":"DeepSeek-V4.1-Flash","context":300000,"output":32768}]'
      QODER_WORKER_BASE_PORT: "${QODER_WORKER_BASE_PORT:-32100}"
      QODER_PROXY_URL: "${QODER_PROXY_URL:-}"
      UPDATE_SOCKET_PATH: "/run/cli2api-updater/updater.sock"
      UPDATE_AGENT_URL: "${UPDATE_AGENT_URL:-}"
      UPDATE_AGENT_TOKEN: "${UPDATE_AGENT_TOKEN:-}"
      UPDATE_GITHUB_TOKEN: "${UPDATE_GITHUB_TOKEN:-}"
      # Request-log retention: default 7 days / 20k rows. Raise both when the
      # usage/cost panel needs a longer history (~0.7 KB/row; ~150 MB at 90d @ 1.5k rows/day).
      CLI2API_LOG_RETENTION_DAYS: "${CLI2API_LOG_RETENTION_DAYS:-7}"
      CLI2API_LOG_MAX_ROWS: "${CLI2API_LOG_MAX_ROWS:-20000}"
      # zcode client identity knobs. The provider reads these from its own
      # environment, and compose passes only what is listed here: a value set in
      # .env alone never reached the container. ZCODE_APP_VERSION pins the
      # reported client build (a newer one the gateway turns away can be rolled
      # back without a rebuild) — set it to a build ZCode actually released: a
      # version number the gateway does not know (3.17.0, tested) answers
      # 429 code 3012 "blocked due to unusual activity" and cools the account.
      # ZCODE_CREDENTIAL_SECRET /
      # ZCODE_CREDENTIAL_SEED open a sealed ZCode credentials.json on import.
      ZCODE_APP_VERSION: "${ZCODE_APP_VERSION:-}"
      ZCODE_CREDENTIAL_SECRET: "${ZCODE_CREDENTIAL_SECRET:-}"
      ZCODE_CREDENTIAL_SEED: "${ZCODE_CREDENTIAL_SEED:-}"
      ZCODE_IDENTITY_PLATFORM: "${ZCODE_IDENTITY_PLATFORM:-}"
      ZCODE_IDENTITY_OS_VERSION: "${ZCODE_IDENTITY_OS_VERSION:-}"
      ZCODE_IDENTITY_CLIENT_LANGUAGE: "${ZCODE_IDENTITY_CLIENT_LANGUAGE:-}"
      ZCODE_IDENTITY_CLIENT_TIMEZONE: "${ZCODE_IDENTITY_CLIENT_TIMEZONE:-}"
      ZCODE_DEVICE_MID: "${ZCODE_DEVICE_MID:-}"
      # Set to any value to stop following the upstream's endpoint mapping
      # table (the escape hatch when a published table misbehaves).
      ZCODE_DISABLE_ENDPOINT_MAPPING: "${ZCODE_DISABLE_ENDPOINT_MAPPING:-}"
    volumes:
      - qoder-data:/data
      - "${CLI2API_UPDATER_SOCKET_DIR:-/tmp/cli2api-updater}:/run/cli2api-updater:ro"
    tmpfs:
      - /run/cli2api:mode=0700
    ports:
      - "127.0.0.1:3010:3010"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3010/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    restart: unless-stopped

volumes:
  qoder-data:
